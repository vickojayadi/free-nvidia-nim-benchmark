name: NVIDIA NIM Benchmark

on:
  schedule:
    # Run at minute 17 to avoid the busiest start-of-hour window.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvidia-nim-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify benchmark version
        run: |
          python nim_benchmark.py --version
          python - <<'PY'
          import nim_benchmark as nb
          assert nb.BENCHMARK_VERSION == "1.2.0", nb.BENCHMARK_VERSION
          print("Verified benchmark version:", nb.BENCHMARK_VERSION)
          PY

      - name: Run unit tests
        run: python -m unittest -v test_nim_benchmark.py

      - name: Run NVIDIA NIM benchmark
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python nim_benchmark.py \
            --runs 2 \
            --max-tokens 192 \
            --pause 1.5 \
            --output nim-benchmark

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp nim-benchmark.json _site/latest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: benchmark
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
